      case 'luminance': return 0.299*r+0.587*g+0.114*b;
      case 'saturation': { let mx=Math.max(r,g,b), mn=Math.min(r,g,b); return mx===0?0:(mx-mn)/mx; }
      case 'hue': { let mx=Math.max(r,g,b), mn=Math.min(r,g,b); if(mx===mn) return 0; let d=mx-mn;
        if(mx===r) return ((g-b)/d+(g<b?6:0))/6; if(mx===g) return ((b-r)/d+2)/6; return ((r-g)/d+4)/6; }
      case 'red': return r; case 'green': return g; case 'blue': return b;
      default: return 0.299*r+0.587*g+0.114*b;
    }
  }

  // 裁切 & 缩放为正方形
  function cropAndResize(img, size) {
    const c = document.createElement('canvas'); c.width = size; c.height = size;
    const octx = c.getContext('2d');
    const iw = img.naturalWidth, ih = img.naturalHeight;
    let sx, sy, sw, sh;
    if (iw/ih > 1) { sh = ih; sw = ih; sx = (iw-sw)/2; sy = 0; }
    else { sw = iw; sh = iw; sx = 0; sy = (ih-sh)/2; }
    octx.drawImage(img, sx, sy, sw, sh, 0, 0, size, size);
    return octx.getImageData(0,0,size,size);
  }
  // 核心映射 (预处理用)
  function remapImageBySorting(sourceImgData, targetImgData, method) {
    const size = sourceImgData.width;
    function extractPixels(imgData) {
      const d = imgData.data, arr = [];
      for (let y=0; y<size; y++) for (let x=0; x<size; x++) {
        const idx = (y*size + x) * 4;
        const r = d[idx], g = d[idx+1], b = d[idx+2];
        arr.push({ r, g, b, x, y, key: sortKey(r,g,b,method) });
      }
      arr.sort((a,b) => a.key - b.key);
      return arr;
    }
    const srcPixels = extractPixels(sourceImgData);
    const tgtPixels = extractPixels(targetImgData);
    const outData = new Uint8ClampedArray(size * size * 4);
    for (let i = 0; i < srcPixels.length; i++) {
      const src = srcPixels[i], tgt = tgtPixels[i];
      const outIdx = (tgt.y * size + tgt.x) * 4;
      outData[outIdx] = src.r; outData[outIdx+1] = src.g; outData[outIdx+2] = src.b; outData[outIdx+3] = 255;
    }
    return new ImageData(outData, size, size);
  }

  // 标准排序与配对
  function processImages() {
    if (!imageAData || !imageBData) return;
    const size = imageAData.width;
    const method = getSortMethod();
    function extract(imgData) {
      const d = imgData.data, pixels = [];
      for(let y=0; y<size; y++) for(let x=0; x<size; x++) {
        const idx = (y*size+x)*4;
        pixels.push({ r:d[idx], g:d[idx+1], b:d[idx+2], x, y, key: sortKey(d[idx],d[idx+1],d[idx+2],method) });
      }
      return pixels;
    }
    let pixelsA = extract(imageAData), pixelsB = extract(imageBData);
    pixelsA.sort((a,b)=>a.key-b.key); pixelsB.sort((a,b)=>a.key-b.key);
    sortedA = new Array(size*size);
    for(let i=0;i<pixelsA.length;i++) {
      sortedA[i] = {
        r: pixelsA[i].r, g: pixelsA[i].g, b: pixelsA[i].b,
        dr: pixelsB[i].r, dg: pixelsB[i].g, db: pixelsB[i].b,
        sx: pixelsA[i].x, sy: pixelsA[i].y,
        tx: pixelsB[i].x, ty: pixelsB[i].y,
        key: pixelsA[i].key
      };
    }
    optimizePairing(sortedA);
  }
  function optimizePairing(arr) {
    let start=0, n=arr.length;
    while(start<n) {
      let end=start+1;
      while(end<n && arr[end].key===arr[start].key) end++;
      if(end-start>1) {
        let srcs = arr.slice(start,end).map(p=>({sx:p.sx, sy:p.sy}));
        let tgts = arr.slice(start,end).map(p=>({tx:p.tx, ty:p.ty, dr:p.dr, dg:p.dg, db:p.db}));
        srcs.sort((a,b)=>(a.sx+a.sy)-(b.sx+b.sy)||a.sx-b.sx||a.sy-b.sy);
        tgts.sort((a,b)=>(a.tx+a.ty)-(b.tx+b.ty)||a.tx-b.tx||a.ty-b.ty);
        for(let i=start;i<end;i++) {
          let t = tgts[i-start];
          arr[i].tx=t.tx; arr[i].ty=t.ty; arr[i].dr=t.dr; arr[i].dg=t.dg; arr[i].db=t.db;
        }
      }
      start=end;
    }
  }

  // 渲染
  function setCanvasSize(size) {
    canvas.width = size; canvas.height = size;
    let ds = getDisplaySize();
    canvas.style.width = ds + 'px'; canvas.style.height = ds + 'px';
  }
  function renderImageA() { if(imageAData) { setCanvasSize(imageAData.width); ctx.putImageData(imageAData,0,0); } }
  function pixelColor(p, progress) {
    if(!colorMorphOn) return { r:p.r, g:p.g, b:p.b };
    return { r:(p.r+(p.dr-p.r)*progress+0.5)|0, g:(p.g+(p.dg-p.g)*progress+0.5)|0, b:(p.b+(p.db-p.b)*progress+0.5)|0 };
  }
  function paintFrame(progress, dst) {
    const size = imageAData.width;
    let data = dst.data;
    if(bgImgAOn && imageAData) data.set(imageAData.data);
    else for(let i=0;i<data.length;i+=4) { data[i]=10; data[i+1]=8; data[i+2]=20; data[i+3]=255; }
    for(const p of sortedA) {
      let ix = Math.round(p.sx+(p.tx-p.sx)*progress), iy = Math.round(p.sy+(p.ty-p.sy)*progress);
      if(ix>=0 && ix<size && iy>=0 && iy<size) {
        let idx = (iy*size+ix)*4, c = pixelColor(p,progress);
        data[idx]=c.r; data[idx+1]=c.g; data[idx+2]=c.b; data[idx+3]=255;
      }
    }
  }
  function renderFrame(progress) {
    if(!sortedA) return;
    const size = imageAData.width; setCanvasSize(size);
    if(!trailOn) {
      let imgData = ctx.createImageData(size,size);
      paintFrame(progress, imgData);
      ctx.putImageData(imgData,0,0);
    } else {
      if(!trailBuffer || trailBuffer.width!==size) { trailBuffer=ctx.createImageData(size,size); initTrailBuffer(size); }
      let buf = trailBuffer.data, decay=0.98;
      if(bgImgAOn && imageAData) { let src=imageAData.data;
        for(let i=0;i<buf.length;i+=4) { buf[i]=buf[i]*decay+src[i]*(1-decay); buf[i+1]=buf[i+1]*decay+src[i+1]*(1-decay); buf[i+2]=buf[i+2]*decay+src[i+2]*(1-decay); buf[i+3]=255; } }
      else for(let i=0;i<buf.length;i+=4) { buf[i]*=decay; buf[i+1]*=decay; buf[i+2]*=decay; buf[i+3]=255; }
      for(const p of sortedA) {
        let ix = Math.round(p.sx+(p.tx-p.sx)*progress), iy = Math.round(p.sy+(p.ty-p.sy)*progress);
        if(ix>=0 && ix<size && iy>=0 && iy<size) {
          let idx=(iy*size+ix)*4, c=pixelColor(p,progress);
          buf[idx]=c.r; buf[idx+1]=c.g; buf[idx+2]=c.b; buf[idx+3]=255;
        }
      }
      ctx.putImageData(trailBuffer,0,0);
    }
  }
  function initTrailBuffer(size) {
    if(bgImgAOn && imageAData) trailBuffer.data.set(imageAData.data);
    else for(let i=0;i<trailBuffer.data.length;i+=4) { trailBuffer.data[i]=10; trailBuffer.data[i+1]=8; trailBuffer.data[i+2]=20; trailBuffer.data[i+3]=255; }
  }
  function easeInOutCubic(t) { return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
// 预处理：颜色合并中介
  async function preprocessWithColorMerging() {
    if (isAnimating || isRecording) return;
    if (!rawImageAData || !rawImageBData) { statusEl.textContent='请先上传两张图片'; statusEl.className='status warning'; return; }
    lockButtons(true); btnPreprocess.disabled = true;
    statusEl.textContent = '🌈 颜色合并中介: 统计颜色 → 生成C → 映射回A/B ...';
    statusEl.className = 'status processing';
    await new Promise(r => setTimeout(r, 30));
    try {
      const size = rawImageAData.width;
      const totalPixels = size * size;
      const buildColorFreq = (imgData) => {
        const freq = new Map(), data = imgData.data;
        for (let i = 0; i < totalPixels; i++) {
          const r=data[i*4], g=data[i*4+1], b=data[i*4+2], key=`${r},${g},${b}`;
          freq.set(key, (freq.get(key) || 0) + 1);
        }
        return freq;
      };
      const freqA = buildColorFreq(rawImageAData), freqB = buildColorFreq(rawImageBData);
      const mergedFreq = new Map();
      for (let [c,n] of freqA.entries()) mergedFreq.set(c,n);
      for (let [c,n] of freqB.entries()) mergedFreq.set(c, (mergedFreq.get(c)||0)+n);
      let targetFreq = new Map(), sumTarget = 0;
      for (let [color,total] of mergedFreq.entries()) {
        let t = Math.round(total/2); if(t===0 && total>0) t=1;
        targetFreq.set(color,t); sumTarget += t;
      }
      let diff = totalPixels - sumTarget;
      if(diff!==0) {
        const sortedColors = Array.from(targetFreq.entries()).sort((a,b)=>b[1]-a[1]);
        let idx=0;
        while(diff!==0 && idx<sortedColors.length) {
          const color=sortedColors[idx][0];
          if(diff>0){ targetFreq.set(color,targetFreq.get(color)+1); diff--; }
          else if(targetFreq.get(color)>0){ targetFreq.set(color,targetFreq.get(color)-1); diff++; }
          idx=(idx+1)%sortedColors.length;
        }
      }
      let pixelList=[];
      for (let [color,cnt] of targetFreq.entries()) {
        const [r,g,b]=color.split(',').map(Number);
        for(let i=0;i<cnt;i++) pixelList.push([r,g,b]);
      }
      if(pixelList.length!==totalPixels){ while(pixelList.length<totalPixels)pixelList.push([0,0,0]); pixelList=pixelList.slice(0,totalPixels); }
      for(let i=pixelList.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pixelList[i],pixelList[j]]=[pixelList[j],pixelList[i]]; }
      const cData = new Uint8ClampedArray(totalPixels*4);
      for(let i=0;i<totalPixels;i++){ const [r,g,b]=pixelList[i]; cData[i*4]=r; cData[i*4+1]=g; cData[i*4+2]=b; cData[i*4+3]=255; }
      const imageC = new ImageData(cData, size, size);
      const method = getSortMethod();
      imageAData = remapImageBySorting(imageC, rawImageAData, method);
      imageBData = remapImageBySorting(imageC, rawImageBData, method);
      infoA.textContent = infoA.textContent.split(' [中介]')[0] + ' [中介颜色统一]';
      infoB.textContent = infoB.textContent.split(' [中介]')[0] + ' [中介颜色统一]';
      processImages(); renderImageA();
      const colorCount = targetFreq.size;
      statusEl.textContent = `✅ 预处理完成！A/B 现共用 ${colorCount} 种颜色，数量完全一致。`;
      statusEl.className = 'status ready';
    } catch (err) {
      console.error(err);
      statusEl.textContent = '⚠ 预处理失败: ' + err.message;
      statusEl.className = 'status warning';
    } finally {
      unlockButtons(); btnPreprocess.disabled = false;
    }
  }

  // 动画预览
  function startAnimation(onDone) {
    if (isAnimating || !sortedA) return;
    isAnimating=true; trailBuffer=null;
    const duration=getDurationMs(), startTime=performance.now();
    function frame(now){
      let elapsed=now-startTime, raw=Math.min(elapsed/duration,1);
      let t = reversePlay ? easeInOutCubic(1-raw) : easeInOutCubic(raw);
      renderFrame(t); setProgress(reversePlay ? 1-raw : raw, false);
      if(raw<1) animationId=requestAnimationFrame(frame);
      else { isAnimating=false; animationId=null; trailBuffer=null; setProgress(0,false); if(onDone) onDone(); }
    }
    animationId=requestAnimationFrame(frame);
  }
  function handleTransform() {
    if(isAnimating||isRecording||!sortedA) return;
    lockButtons(true);
    statusEl.textContent='变换中...'; statusEl.className='status animating';
    startAnimation(()=>{ unlockButtons(); statusEl.textContent='变换完成！用A的像素拼出B的结构。'; statusEl.className='status ready'; });
  }
  function resetToOriginal() {
    if(isAnimating){ cancelAnimationFrame(animationId); isAnimating=false; }
    if(rawImageAData && rawImageBData) {
      imageAData = rawImageAData; imageBData = rawImageBData;
      processImages(); renderImageA();
      statusEl.textContent = '已重置到原始图片 (未预处理)';
    } else {
      statusEl.textContent = '无原始备份';
    }
    setProgress(0,false); unlockButtons(); statusEl.className='status ready';
  }
// GIF 导出（gif.js）
  function gifWorkerUrl() {
    const el = document.getElementById('gifWorkerSrc');
    return (el && el.textContent) ? URL.createObjectURL(new Blob([el.textContent], { type: 'text/javascript' })) : '';
  }
  async function exportGif() {
    if (isAnimating || isRecording || !sortedA) return;
    if (typeof window.GIF === 'undefined') {
      statusEl.textContent = '⚠ GIF 编码器未就绪，请刷新后重试';
      statusEl.className = 'status warning';
      return;
    }
    lockButtons(true);
    statusEl.textContent = 'GIF: 逐帧渲染中 ...';
    statusEl.className = 'status recording';
    const fps = getExportFps();
    const timeline = buildTimeline();
    const frames = timeline.length;
    const size = imageAData.width;
    const gif = new window.GIF({
      workers: 2,
      quality: 10,
      width: size,
      height: size,
      workerScript: gifWorkerUrl()
    });
    try {
      const scratch = document.createElement('canvas'); scratch.width = size; scratch.height = size;
      const octx = scratch.getContext('2d');
      const tmpImg = octx.createImageData(size, size);
      for (let i = 0; i < frames; i++) {
        paintFrame(timeline[i], tmpImg);
        octx.putImageData(tmpImg, 0, 0);
        gif.addFrame(scratch, { delay: Math.round(1000 / fps), copy: true });
        setProgress(i / (frames - 1), true);
        if (i % 12 === 11) await new Promise(r => setTimeout(r, 0));
      }
      gif.render();
      const blob = await new Promise((resolve, reject) => {
        gif.on('finished', resolve);
        gif.on('abort', () => reject(new Error('GIF 编码被中断')));
      });
      downloadBlob(blob, `pixel-morph-${size}px.gif`);
      statusEl.textContent = `✅ GIF 已导出 (${(blob.size / 1024 / 1024).toFixed(2)} MB)`;
      statusEl.className = 'status ready';
    } catch (err) {
      console.error(err);
      statusEl.textContent = '⚠ GIF 导出失败: ' + err.message;
      statusEl.className = 'status warning';
    } finally {
      setProgress(0, false);
      unlockButtons();
    }
  }

  // WebM 导出：确定性逐帧渲染 + WebCodecs 编码（不丢帧，每帧都渲染）
  async function pickEncoder(size, fps) {
    const base = { width: size, height: size, framerate: fps, bitrate: Math.max(1_000_000, size * size * 8) };
    const cands = [
      { codec: 'vp09.00.10.08', ...base },
      { codec: 'av01.0.04M.08', ...base },
      { codec: 'vp8', ...base }
    ];
    for (const c of cands) {
      try { const s = await VideoEncoder.isConfigSupported(c); if (s.supported) return c; } catch (e) {}
    }
    return null;
  }
  function vpCodecToMux(codec) {
    if (/^vp9/.test(codec)) return 'V_VP9';
    if (/^av0/.test(codec)) return 'V_AV1';
    return 'V_VP8';
  }
  async function exportWebM() {
    if (isAnimating || isRecording || !sortedA) return;
    if (typeof VideoEncoder === 'undefined' || typeof VideoFrame === 'undefined') {
      statusEl.textContent = '⚠ 浏览器不支持 WebCodecs（无法导出 WebM）';
      statusEl.className = 'status warning';
      return;
    }
    let MuxerCtor, ArrayBufferCtor;
    try {
      const el = document.getElementById('webmMuxerSrc');
      const mod = await import(URL.createObjectURL(new Blob([el.textContent], { type: 'text/javascript' })));
      MuxerCtor = mod.Muxer; ArrayBufferCtor = mod.ArrayBufferTarget;
    } catch (e) {
      statusEl.textContent = '⚠ webm-muxer 加载失败: ' + e.message;
      statusEl.className = 'status warning';
      return;
    }
    lockButtons(true);
    statusEl.textContent = '视频: 逐帧编码中（每帧都渲染，不丢帧）...';
    statusEl.className = 'status recording';

    const size = imageAData.width;
    const fps = getExportFps();
    const timeline = buildTimeline();
    const frames = timeline.length;
    const cfg = await pickEncoder(size, fps);
    if (!cfg) {
      statusEl.textContent = '⚠ 没有可用的视频编码器';
      statusEl.className = 'status warning';
      setProgress(0, true); unlockButtons();
      return;
    }
    const muxer = new MuxerCtor({
      target: new ArrayBufferCtor(),
      video: { codec: vpCodecToMux(cfg.codec), width: size, height: size, frameRate: fps }
    });
    let encoder = null;
    try {
      encoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: (e) => { console.error('encoder error', e); }
      });
      encoder.configure(cfg);
      const scratch = document.createElement('canvas'); scratch.width = size; scratch.height = size;
      const octx = scratch.getContext('2d');
      const tmpImg = octx.createImageData(size, size);
      const gop = Math.max(1, Math.round(fps * 2));
      for (let i = 0; i < frames; i++) {
        paintFrame(timeline[i], tmpImg);
        octx.putImageData(tmpImg, 0, 0);
        const frame = new VideoFrame(scratch, { timestamp: Math.round(i / fps * 1_000_000) });
        encoder.encode(frame, { keyFrame: i % gop === 0 });
        frame.close();
        setProgress(i / (frames - 1), true);
        if (i % 12 === 11) await new Promise(r => setTimeout(r, 0));
      }
      await encoder.flush();
    } catch (err) {
      console.error(err);
      try { if (encoder) encoder.close(); } catch (e) {}
      statusEl.textContent = '⚠ 视频编码失败: ' + err.message;
      statusEl.className = 'status warning';
      setProgress(0, true); unlockButtons();
      return;
    }
    try { encoder.close(); } catch (e) {}
    muxer.finalize();
    const { buffer } = muxer.target;
    downloadBlob(new Blob([buffer], { type: 'video/webm' }), `pixel-sort-${size}px.webm`);
    statusEl.textContent = `✅ 视频已导出 (${(buffer.byteLength / 1024 / 1024).toFixed(2)} MB)`;
    statusEl.className = 'status ready';
    setProgress(0, true);
    unlockButtons();
  }

  // 图片上传
  function fileToImage(file) {
    return new Promise((resolve, reject) => {
      let r=new FileReader();
      r.onload=e=>{ let img=new Image(); img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('加载失败')); img.src=e.target.result; };
      r.onerror=()=>reject(new Error('读取失败')); r.readAsDataURL(file);
    });
  }
  function updateRawAndWorking(side, imgData) {
    if(side==='A'){ rawImageAData=imgData; imageAData=imgData; }
    else { rawImageBData=imgData; imageBData=imgData; }
  }
  function createUploadHandler(zoneEl, fileInput, infoEl, side) {
    async function handleFile(file) {
      infoEl.textContent='加载中...';
      try {
        let img=await fileToImage(file);
        if(side==='A'){ originalImgA=img; naturalSizeA=Math.min(img.naturalWidth,img.naturalHeight); }
        else { originalImgB=img; naturalSizeB=Math.min(img.naturalWidth,img.naturalHeight); }
        zoneEl.querySelector('img')?.remove();
        let ph=zoneEl.querySelector('.ph-ic'); if(ph) ph.style.display='none';
        let thumb=document.createElement('img'); thumb.src=URL.createObjectURL(file); zoneEl.appendChild(thumb);
        setAutoResolution();
        let size=getResolution();
        let imgData=cropAndResize(img,size);
        updateRawAndWorking(side, imgData);
        if(side==='A') infoA.textContent=`原始: ${img.naturalWidth}×${img.naturalHeight} → ${size}×${size}`;
        else infoB.textContent=`原始: ${img.naturalWidth}×${img.naturalHeight} → ${size}×${size}`;
        if(rawImageAData && rawImageBData) {
          processImages(); renderImageA(); unlockButtons();
          statusEl.textContent='准备就绪 — 可进行颜色合并预处理或直接变换';
          statusEl.className='status ready';
        } else {
          statusEl.textContent=side==='A'?'已加载A — 请上传B':'已加载B — 请上传A';
        }
      } catch(err){ infoEl.textContent='失败'; console.error(err); }
    }
    zoneEl.addEventListener('click',()=>fileInput.click());
    zoneEl.addEventListener('dragover',e=>{e.preventDefault(); zoneEl.style.borderColor='#7c0a21';});
    zoneEl.addEventListener('dragleave',()=>zoneEl.style.borderColor='');
    zoneEl.addEventListener('drop',e=>{e.preventDefault(); zoneEl.style.borderColor=''; if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);});
    fileInput.addEventListener('change',()=>{if(fileInput.files[0]) handleFile(fileInput.files[0]);});
  }
  createUploadHandler(zoneA,fileA,infoA,'A');
  createUploadHandler(zoneB,fileB,infoB,'B');

  // 分辨率：原地重裁切，不再强制 120 或刷新页面
  function applyResolution() {
    const size=getResolution();
    if(originalImgA){ rawImageAData=cropAndResize(originalImgA,size); imageAData=rawImageAData; infoA.textContent=`原始: ${originalImgA.naturalWidth}×${originalImgA.naturalHeight} → ${size}×${size}`; }
    if(originalImgB){ rawImageBData=cropAndResize(originalImgB,size); imageBData=rawImageBData; infoB.textContent=`原始: ${originalImgB.naturalWidth}×${originalImgB.naturalHeight} → ${size}×${size}`; }
    if(imageAData && imageBData){ processImages(); renderImageA(); }
    updateResInfo(size);
  }
  resInput.addEventListener('input',()=>{ autoRes=false; updateResInfo(getResolution()); });
  resInput.addEventListener('change',()=>{ if(isAnimating||isRecording)return; autoRes=false; applyResolution(); });

  // 事件绑定
  sortSelect.addEventListener('change',()=>{ if(!isAnimating&&!isRecording&&imageAData&&imageBData){ processImages(); renderImageA(); statusEl.textContent='排序方式已更新'; statusEl.className='status ready'; } });
  btnTransform.addEventListener('click',handleTransform);
  btnReset.addEventListener('click',resetToOriginal);
  btnPreprocess.addEventListener('click',preprocessWithColorMerging);
  btnTrail.addEventListener('click',()=>{trailOn=!trailOn; btnTrail.classList.toggle('active',trailOn); trailBuffer=null;});
  btnBgImgA.addEventListener('click',()=>{bgImgAOn=!bgImgAOn; btnBgImgA.classList.toggle('active',bgImgAOn); trailBuffer=null;});
  btnColorMorph.addEventListener('click',()=>{colorMorphOn=!colorMorphOn; btnColorMorph.classList.toggle('active',colorMorphOn);});
  btnReverse.addEventListener('click',()=>{reversePlay=!reversePlay; btnReverse.classList.toggle('active',reversePlay);});
  btnExportGif.addEventListener('click',exportGif);
  btnExport.addEventListener('click',exportWebM);
  window.addEventListener('resize',()=>{ if(imageAData&&!isAnimating&&!isRecording){ setCanvasSize(imageAData.width); ctx.putImageData(imageAData,0,0); } });

  updateResInfo(getResolution());
  setCanvasSize(getResolution());
})();
</script>
</body>
</html>
