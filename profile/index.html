<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>QR Personal Profile</title>
<style id="szys">

:root{--bjsdfz:#7c0a21;--bjsdfz-a:#7c0a2164;--wzys:black;--wzys-a:rgba(80,80,80,.9);--hanbj:rgba(255,255,255,.88);--bg:white;--bg2:#f5f5f5}
body.dark{--wzys:#ddd;--wzys-a:rgba(210,210,210,.92);--hanbj:rgba(30,30,30,.85);--bg:#121212;--bg2:#1a1a1a}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;transition:background .2s,box-shadow .2s,color .2s}
body{font-family:'Times New Roman',宋体,serif;color:var(--wzys);background:var(--bg);overflow-y:auto;overflow-x:hidden;min-height:100vh;-webkit-user-select:none;user-select:none}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:var(--bg)}
.red-kuang{transform:translateZ(0);border:0;border-radius:.15em;background-color:var(--hanbj);box-shadow:0 2px 9px var(--bjsdfz-a);overflow:auto;display:flex;flex-direction:column;position:relative}
.red-kuang::before{content:"";background:inherit;background-size:cover;filter:blur(8px);z-index:-1;position:absolute;top:0;left:0;width:100%;height:100%}
input,select,textarea{background-color:var(--hanbj);border:0;border-bottom:2px solid transparent;outline:none;border-radius:.15em;color:var(--wzys);text-indent:6px;font-family:'Times New Roman',serif;font-size:16px;font-style:italic;box-shadow:0 1px 5px var(--bjsdfz-a);backdrop-filter:blur(15px);-webkit-appearance:none;height:30px}
input:hover,select:hover,textarea:hover{box-shadow:0 0 10px var(--bjsdfz-a)}
input:focus,select:focus,textarea:focus{border-bottom:2px solid var(--bjsdfz-a)}
input::placeholder,textarea::placeholder{color:var(--wzys-a)}
option{color:var(--bjsdfz)}
input[type=button],button.btn{font-style:normal;text-indent:0;cursor:default;font-family:'Times New Roman',serif;display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1}
input[type=button]:hover,button.btn:hover{box-shadow:0 1px 5px var(--bjsdfz)}
textarea{font-style:italic;text-indent:6px;padding:6px;resize:none;line-height:1.5;height:auto}
/* Standard scrollbar per persentation.md: 14px wide, 5px transparent border */
*::-webkit-scrollbar{width:14px;height:14px;border-radius:.15em}
*::-webkit-scrollbar-track{transition:.2s;background-color:rgba(255,255,255,0);border-radius:5px}
*::-webkit-scrollbar-thumb{transition:.2s;display:block;background:rgba(0,0,0,.5);background-color:var(--bjsdfz-a);background-clip:padding-box;border:5px solid transparent;border-radius:.15em}
*::-webkit-scrollbar-thumb:hover{display:block;border:4px solid transparent;background-color:var(--bjsdfz)}
*::-webkit-scrollbar-button{display:none}
*::-webkit-scrollbar-corner{background-color:rgba(0,0,0,0)}
/* Nav */
.nav-bar{position:fixed;top:10px;right:16px;z-index:20;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nb{padding:6px 14px;font-size:14px;border-radius:.15em;cursor:default;background:var(--hanbj);box-shadow:0 1px 5px var(--bjsdfz-a);color:var(--bjsdfz);font-family:'Times New Roman',serif;border:0;white-space:nowrap}
.nb:hover{box-shadow:0 0 10px var(--bjsdfz);background:var(--bjsdfz);color:#fff}
.lang-sw{position:fixed;top:10px;left:16px;z-index:20;display:flex;gap:4px}
.lang-sw .nb{padding:6px 10px;font-size:13px}
/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;background:var(--bjsdfz);color:#fff;padding:10px 24px;border-radius:.15em;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
/* Layout */
.app-wrap{display:flex;justify-content:center;align-items:center;padding:60px 20px 30px;min-height:100vh;width:100%}
.panel{width:100%;max-width:1000px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
/* Sub-panels */
.cp-sm{max-width:640px;min-height:500px;padding:40px 30px 30px;text-align:center}
.cp-sm h1{font-size:36px;color:var(--bjsdfz);font-weight:normal;margin-bottom:10px}
.cp-sm .sub{font-size:15px;color:var(--wzys-a);font-style:italic;margin-bottom:20px}
/* Wizard */
.cp-wiz{min-height:620px;padding:0;display:flex;flex-direction:column}
.cp-wiz h1{font-size:22px;color:var(--bjsdfz);font-weight:normal;padding:20px 24px 4px;flex-shrink:0}
.cp-wiz .wiz-sub{font-size:13px;color:var(--wzys-a);padding:0 24px 10px;flex-shrink:0;font-style:italic}
.cp-wiz .wiz-top{padding:0 14px 6px;flex-shrink:0}
.cp-wiz .wiz-body{flex:1;overflow-y:auto;padding:0 14px;min-height:300px}
.cp-wiz .wiz-foot{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;border-top:1px solid var(--bjsdfz-a);min-height:50px;gap:8px;flex-wrap:wrap}
/* Items */
.item-grid{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;padding-bottom:6px}
.item-card{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:.15em;font-size:14px;cursor:default;height:30px;line-height:1;white-space:nowrap;background:var(--hanbj);box-shadow:0 1px 3px var(--bjsdfz-a);color:var(--wzys-a);border:1px solid transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.item-card.s1{color:var(--wzys);border-color:var(--bjsdfz-a);box-shadow:0 1px 5px var(--bjsdfz-a);background:rgba(124,10,33,.06)}
.item-card.s2{color:#c0392b;border-color:rgba(192,57,43,.5);box-shadow:0 1px 5px rgba(192,57,43,.2);background:rgba(192,57,43,.06)}
.item-card.s3{color:var(--bjsdfz);border-color:var(--bjsdfz);box-shadow:0 1px 7px var(--bjsdfz);font-weight:bold;background:rgba(124,10,33,.1)}
.item-card .st-icon{display:inline-block;width:14px;height:14px;line-height:14px;text-align:center;border-radius:3px;font-size:11px;font-weight:bold;margin-right:1px}
.item-card.s0 .st-icon{opacity:0}.item-card.s1 .st-icon{background:var(--bjsdfz-a);color:var(--bjsdfz)}.item-card.s2 .st-icon{background:rgba(192,57,43,.3);color:#c0392b}.item-card.s3 .st-icon{background:var(--bjsdfz);color:#fff}
.item-card:hover,.item-card:active{border-color:var(--bjsdfz);box-shadow:0 0 8px var(--bjsdfz-a)}
.item-card.view-only{cursor:default}.item-card.view-only:hover{border-color:transparent;box-shadow:0 1px 3px var(--bjsdfz-a)}
.grp-hdr{font-size:14px;color:var(--bjsdfz);padding:8px 2px 4px;margin-top:6px;font-weight:bold;border-bottom:1px solid var(--bjsdfz-a)}
.grp-div{height:0;border-top:1px dashed var(--bjsdfz-a);margin:8px 0 4px;width:100%;flex-basis:100%}
.search-row{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.search-row input{flex:1;min-width:120px;height:30px;font-size:14px}
.search-row select{height:30px;font-size:13px;font-style:normal;text-indent:3px;min-width:100px}
.legend{display:flex;gap:6px;margin:4px 0 3px;flex-wrap:wrap}
.ldot{width:14px;height:14px;border-radius:3px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold}
.ld0{background:transparent;border:1px dashed var(--wzys-a);color:var(--wzys-a)}.ld1{background:var(--bjsdfz-a);color:var(--bjsdfz)}.ld2{background:rgba(192,57,43,.3);color:#c0392b}.ld3{background:var(--bjsdfz);color:#fff}
/* About/Message */
.cp-about,.cp-msg{max-width:580px;padding:30px 30px;text-align:center}
.cp-about h1,.cp-msg h1{font-size:24px;color:var(--bjsdfz);font-weight:normal;margin-bottom:6px}
.cp-about .sub,.cp-msg .sub{font-size:13px;color:var(--wzys-a);font-style:italic;margin-bottom:14px}
.cp-about .fl{text-align:left;font-size:13px;color:var(--wzys);padding:6px 2px 2px 0}
.cp-about input,.cp-about textarea,.cp-msg textarea{width:100%;margin-bottom:4px;display:block}
.cp-about textarea{height:80px}.cp-msg textarea{height:100px}
/* Finish */
.cp-finish{max-width:1000px;min-height:620px;padding:0;overflow:hidden}
.fin-split{display:flex;flex-direction:row;height:100%;min-height:620px}
.fin-left{flex:1;padding:20px 24px;overflow-y:auto;min-width:0}
.fin-right{width:320px;min-width:280px;padding:16px;display:flex;flex-direction:column;align-items:center;border-left:1px solid var(--bjsdfz-a);flex-shrink:0}
.fin-left h1{font-size:26px;color:var(--bjsdfz);font-weight:normal;margin-bottom:4px}
.fin-left .bio{font-size:13px;color:var(--wzys-a);font-style:italic;margin-bottom:4px}
.fin-left .msg{font-size:12px;color:var(--bjsdfz);font-style:italic;margin-bottom:10px}
.fin-sec{margin:5px 0}.fin-sec h3{font-size:13px;color:var(--bjsdfz);margin-bottom:2px}
.fin-sec .tags,.fin-sec .tg{display:flex;flex-wrap:wrap;gap:3px}
.fin-sec .tag{padding:2px 7px;font-size:12px;border-radius:.15em;background:var(--bjsdfz-a);color:var(--wzys)}
.fin-sec .tag.lv{background:var(--bjsdfz);color:#fff}
.qr-box{width:260px;height:260px;background:#fff;padding:6px;border-radius:.15em;box-shadow:0 2px 9px var(--bjsdfz-a);display:flex;align-items:center;justify-content:center}
.qr-box canvas{width:248px;height:248px}
.cap-info{font-size:12px;color:var(--wzys-a);text-align:center;margin:8px 0 3px}
.cap-bar{width:100%;height:4px;background:var(--bjsdfz-a);border-radius:2px;margin-bottom:8px;overflow:hidden}
.cap-fill{height:100%;background:var(--bjsdfz);border-radius:2px}
.dl-btn{width:100%;height:34px;font-size:13px;margin:3px 0}
/* View */
.cp-view{max-width:1000px;min-height:560px;padding:0}
.vw-head{text-align:center;padding:22px 24px 8px;flex-shrink:0}
.vw-head h1{font-size:26px;color:var(--bjsdfz);font-weight:normal}
.vw-head .bio{font-size:13px;color:var(--wzys-a);font-style:italic;margin:3px 0}
.vw-head .msg{font-size:13px;color:var(--bjsdfz);font-style:italic}
.vw-body{flex:1;overflow-y:auto;padding:8px 24px 16px;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start}
.vw-sec{flex:1;min-width:160px}.vw-sec h3{font-size:13px;color:var(--bjsdfz);margin-bottom:3px}
.vt{padding:2px 7px;font-size:12px;border-radius:.15em;display:inline-block;margin:2px}
.vt-l{background:var(--bjsdfz);color:#fff}.vt-t{background:var(--bjsdfz-a);color:var(--wzys)}.vt-d{background:rgba(192,57,43,.2);color:#c0392b}
.cat-tab{padding:5px 12px;font-size:13px;border-radius:.15em;cursor:pointer;background:var(--hanbj);box-shadow:0 1px 3px var(--bjsdfz-a);color:var(--wzys-a);border:1px solid transparent;display:inline-block;user-select:none}
.cat-tab.active{color:var(--bjsdfz);box-shadow:0 0 6px var(--bjsdfz);border-color:var(--bjsdfz)}
.cat-tab:hover{color:var(--bjsdfz);box-shadow:0 0 8px var(--bjsdfz-a);border-color:var(--bjsdfz-a)}
/* Scan */
.cp-scan{max-width:520px;padding:28px;text-align:center}
.scan-drop{width:200px;height:160px;margin:0 auto;border:2px dashed var(--bjsdfz-a);border-radius:.15em;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default}
.scan-drop:hover{border-color:var(--bjsdfz)}
/* Buttons */
.btn-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--hanbj);border:1px solid var(--bjsdfz-a);border-radius:.15em;padding:7px 16px;font-size:14px;color:var(--bjsdfz);cursor:default;font-family:'Times New Roman',serif;white-space:nowrap}
.btn:hover{background:var(--bjsdfz);color:#fff;box-shadow:0 1px 5px var(--bjsdfz)}
.btn.primary{background:var(--bjsdfz);color:#fff;border-color:var(--bjsdfz)}
.btn.primary:hover{background:#9a0d2a;box-shadow:0 2px 8px var(--bjsdfz)}
.btn.sm{padding:5px 12px;font-size:12px}
/* Mobile */
@media(max-width:700px){
  .panel{max-width:100%}.app-wrap{padding:50px 4px 20px}
  .cp-wiz,.cp-finish,.cp-view{border-radius:0;max-width:100%}
  .cp-wiz h1{padding:14px 12px 4px;font-size:20px}
  .cp-wiz .wiz-sub{padding:0 12px 6px}.cp-wiz .wiz-body{padding:0 8px}
  .cp-wiz .wiz-foot{padding:8px 12px;min-height:44px}.cp-wiz .wiz-top{padding:0 8px 4px}
  .fin-split{flex-direction:column}.fin-right{width:100%;border-left:none;border-top:1px solid var(--bjsdfz-a);max-width:100%}
  .fin-left{max-height:40vh}.item-card{padding:5px 10px;height:34px;font-size:14px}
  .cp-sm,.cp-about,.cp-msg{max-width:100%;min-height:auto;border-radius:0}
  .nav-bar{top:4px;right:4px;gap:3px}.nb{padding:5px 9px;font-size:12px}.lang-sw{top:4px;left:4px}
  .search-row{flex-direction:column}.search-row select{width:100%}
}

.movie-popup{position:fixed;z-index:200;background:var(--hanbj);border:1px solid var(--bjsdfz);border-radius:.15em;box-shadow:0 2px 12px var(--bjsdfz-a);padding:12px 16px;min-width:200px;max-width:300px;font-size:13px;line-height:1.6;display:none;backdrop-filter:blur(15px)}
.movie-popup.show{display:block}
.movie-popup .mp-title{font-size:16px;color:var(--bjsdfz);font-weight:bold;margin-bottom:6px}
.movie-popup .mp-row{color:var(--wzys);margin:2px 0}
.movie-popup .mp-row span{color:var(--wzys-a)}
</style>
</head>

// ==================== BINARY PROTOCOL ====================
// CAT_VER=2 (compact bitmap): items keep their original slot forever.
// To "remove" an item, mark it deleted:true in the data file (tombstone) —
// it still occupies its bitmap slot so all old QR codes stay valid;
// new items are appended at the end. The UI hides deleted items.
const PROTO_VER=1,CAT_VER=2,MAGIC=[0x51,0x52,0x50,0x46];
function encodeProfile(p){
  let te=new TextEncoder(),nB=te.encode((p.name||'').slice(0,64)),bB=te.encode((p.bio||'').slice(0,256)),mB=te.encode((p.message||'').slice(0,256));
  let h=new Uint8Array(8);h.set(MAGIC,0);h[4]=PROTO_VER;h[5]=CAT_VER;h[6]=0;h[7]=0;
  let parts=[h];
  function ws(b){let l=Math.min(b.length,65535),a=new Uint8Array(2+l+1);a[0]=(l>>8)&0xFF;a[1]=l&0xFF;a.set(b.slice(0,l),2);a[2+l]=0;return a}
  parts.push(ws(nB));parts.push(ws(bB));parts.push(ws(mB));
  for(let cat of C.cats){
    let items=C.itemMap[cat.key],st=p.states[cat.key]||{};
    let bc=items.length*2,bytes=Math.ceil(bc/8),bf=new Uint8Array(bytes);
    for(let i=0;i<items.length;i++){let s=st[i]||0,bp=i*2,bi=Math.floor(bp/8),bo=bp%8;bf[bi]|=((s&3)<<(6-bo))}
    parts.push(bf);
  }
  let total=parts.reduce((s,a)=>s+a.length,0),raw=new Uint8Array(total),off=0;
  for(let a of parts){raw.set(a,off);off+=a.length}
  return raw;
}
function decodeProfile(raw,dbg){
  let _dbg=dbg||(()=>{});
  try{
    if(raw.length<8){_dbg('DECODE: too short');return null}
    if(raw[0]!==MAGIC[0]||raw[1]!==MAGIC[1]||raw[2]!==MAGIC[2]||raw[3]!==MAGIC[3]){_dbg('DECODE: bad magic');return null}
    let flags=raw[6],cmp=(flags&1)!==0,payload=raw.slice(8);
    _dbg('DECODE: proto='+raw[4]+' cat='+raw[5]+' flags='+flags+' compressed='+cmp+' payloadLen='+payload.length);
    if(cmp){let dc=rleDecompress(payload);if(!dc){_dbg('DECODE: decompress failed');return null}payload=dc;_dbg('DECODE: decompressed '+dc.length+' bytes')}
    let td=new TextDecoder(),pos=0;
    function rs(){if(pos+2>payload.length)return'';let l=(payload[pos]<<8)|payload[pos+1];pos+=2;if(pos+l+1>payload.length)return'';let b=payload.slice(pos,pos+l);pos+=l+1;return td.decode(b)}
    let name=rs(),bio=rs(),msg=rs(),p={name,bio,message:msg,states:{},protoVer:raw[4],catVer:raw[5]};
    for(let cat of C.cats){
      let items=C.itemMap[cat.key],bc=items.length*2,bytes=Math.ceil(bc/8);
      if(pos+bytes>payload.length)break;
      let st={};for(let i=0;i<items.length;i++){let bp=i*2,bi=Math.floor(bp/8),bo=bp%8,s=(payload[pos+bi]>>(6-bo))&3;if(s!==0)st[i]=s}
      p.states[cat.key]=st;pos+=bytes;
    }
    return p;
  }catch(e){_dbg('DECODE: err '+e.message);return null}
}

// ===== Simple RLE compression =====
function rleCompress(data){
  let out=[],i=0;
  while(i<data.length){
    let b=data[i],run=1;
    while(i+run<data.length&&data[i+run]===b&&run<65535)run++;
    if(run>=4||(b===0&&run>=3)){
      out.push(0xFF);out.push(b);out.push(run&0xFF);out.push((run>>8)&0xFF);i+=run;
    }else{
      if(b===0xFF){out.push(0xFF);out.push(0xFF)}else out.push(b);
      i++;
    }
  }
  return new Uint8Array(out);
}
function rleDecompress(data){
  let out=[],i=0;
  while(i<data.length){
    if(data[i]===0xFF&&i+1<data.length&&data[i+1]!==0xFF){
      let b=data[i+1],count=(data[i+2]|(data[i+3]<<8));
      for(let j=0;j<count;j++)out.push(b);i+=4;
    }else if(data[i]===0xFF&&i+1<data.length&&data[i+1]===0xFF){out.push(0xFF);i+=2}
    else{out.push(data[i]);i++}
  }
  return new Uint8Array(out);
}
function compressPayload(raw){
  try{let c=rleCompress(raw.slice(8));if(c.length<raw.length-8){let f=new Uint8Array(8+c.length);f.set(raw.slice(0,8),0);f[6]|=1;f.set(c,8);return f}}catch(e){}
  return raw;
}

// ===== Custom base85 =====
const B85='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$()*+,-./:;@_~`<>[]{}';
function toB85(bytes){let r='',pad=(4-bytes.length%4)%4,arr=new Uint8Array(bytes.length+pad);arr.set(bytes);for(let i=0;i<arr.length;i+=4){let n=BigInt((((arr[i]<<24)|(arr[i+1]<<16)|(arr[i+2]<<8)|arr[i+3])>>>0));if(n===0n){r+='00000';continue}let chars=[],w=n;for(let j=0;j<5;j++){let d=Number(w%85n);chars.unshift(B85[d]);w=w/85n}r+=chars.join('')}return r}
function fromB85(s){let parts=[];for(let i=0;i<s.length;i+=5){let n=0n,chunk=s.slice(i,i+5);if(chunk.length<5)chunk=chunk.padEnd(5,'0');for(let j=0;j<5;j++){let idx=B85.indexOf(chunk[j]);if(idx<0)idx=0;n=n*85n+BigInt(idx)}parts.push(Number((n>>24n)&0xFFn),Number((n>>16n)&0xFFn),Number((n>>8n)&0xFFn),Number(n&0xFFn))}return new Uint8Array(parts)}

// ===== QR Generation =====
const QR_URL='https://ssssssss.eu.org/profile/';
function generateQRCanvas(dataBytes){
  let b85=toB85(dataBytes);
  let url=QR_URL+'?v='+PROTO_VER+'&c='+CAT_VER+'&d='+encodeURIComponent(b85);
  let qr=qrcode(40,'L');qr.addData(url);qr.make();
  let modCount=qr.getModuleCount(),scale=8,margin=4,size=(modCount+margin*2)*scale;
  let cv=document.createElement('canvas');cv.width=size;cv.height=size,ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#000';
  for(let r=0;r<modCount;r++)for(let c=0;c<modCount;c++)if(qr.isDark(r,c))ctx.fillRect((c+margin)*scale,(r+margin)*scale,scale,scale);
  return cv;
}

  _itemHit(it,q){if(!it)return false;if(itemName(it).toLowerCase().includes(q))return true;if(TG(it.group).toLowerCase().includes(q))return true;let metaMap={movies:MOVIE_META,anime:ANIME_META,games:GAME_META,tv:TV_META}[this._curCat||this._viewCat];if(metaMap){let m=metaMap[it.zh]||metaMap[it.en];if(m){for(let k in m){if(m[k]&&String(m[k]).toLowerCase().includes(q))return true}}}return false},

  toggleWiz(ci,idx,evt){let cat=C.cats[ci],k=cat.key;if(!profile.states[k])profile.states[k]={};let shift=!!(evt&&evt.shiftKey),ctrl=!!(evt&&(evt.ctrlKey||evt.metaKey));let targets=[idx],bulk=false;if(shift&&App._lastCat===k&&App._lastIdx!=null&&App._lastIdx!==idx){let sorted=ordItems(C.itemMap[k]).filter(function(it){return !it.deleted});let pa=sorted.findIndex(function(it){return it.id===App._lastIdx}),pb=sorted.findIndex(function(it){return it.id===idx});if(pa>=0&&pb>=0){bulk=true;targets=[];let a=Math.min(pa,pb),b=Math.max(pa,pb);for(let i=a;i<=b;i++)targets.push(sorted[i].id)}}let cur=profile.states[k][idx]||0;let next;if(bulk){next=cur===0?1:0}else if(ctrl){next=cur===0?1:0}else{next=cur===0?1:cur===1?3:cur===3?2:0}for(let t of targets){profile.states[k][t]=next;let it=C.itemMap[k][t];if(it){let refs=(C.nameIdx[it.zh]||[]).concat(it.en&&it.en!==it.zh?(C.enIdx[it.en]||[]):[]);let seen=new Set();for(let r of refs){let k2=r.cat+':'+r.idx;if(seen.has(k2))continue;seen.add(k2);if(r.cat===k&&r.idx===t)continue;if(!profile.states[r.cat])profile.states[r.cat]={};profile.states[r.cat][r.idx]=next}}let card=document.querySelector('.item-card[data-idx="'+t+'"]');if(card){card.className='item-card'+(next?' s'+next:'');let si2='';if(next===1)si2='✓';else if(next===2)si2='−';else if(next===3)si2='♥';let icon=card.querySelector('.st-icon');if(icon)icon.textContent=si2}}if(!shift&&!ctrl)App._lastCat=k,App._lastIdx=idx;let items=C.itemMap[k],sel=0;for(let it of items){if(it.deleted)continue;if(profile.states[k][it.id])sel++}let subs=document.querySelectorAll('.wiz-sub');if(subs.length)subs[0].textContent=sel+' '+T('rated');let footSpans=document.querySelectorAll('.wiz-foot span');if(footSpans.length>=2)footSpans[1].textContent=sel+'/'+items.length+' '+T('rated');if(bulk){toast(lang==='zh'?(next===1?'已批量选中 '+targets.length+' 项':'已取消选择 '+targets.length+' 项'):(next===1?'Selected '+targets.length+' items':'Deselected '+targets.length+' items'));return}if(ctrl){toast(lang==='zh'?(n   finish(){try{console.log('[FINISH] start');this.saveInputs();let raw=encodeProfile(profile);console.log('[FINISH] encoded',raw.length,'bytes');let compressed=compressPayload(raw);let useCmpr=(compressed[6]&1)!==0;console.log('[FINISH] payload',compressed.length,'bytes, compressed:',useCmpr);let fp=compressed,dataForQR=fp,total=fp.length;if(total>2953){document.getElementById('app').innerHTML='<div class="app-wrap"><div class="panel"><div class="red-kuang cp-sm" style="min-height:220px"><h1 style="color:#c0392b">'+T('tooBig')+'</h1><div class="sub">'+total+' / 2953 bytes ('+(total/2953*100).toFixed(1)+'%)</div><div class="btn-row"><button class="btn" onclick="qStep--;App.renderWiz()">'+T('goBack')+'</button></div></div></div></div>';return}qrCanvas=generateQRCanvas(dataForQR);finPayload=fp;let testBytes=fromB85(encodeURIComponent(toB85(dataForQR)));let testProfile=decodeProfile(testBytes,console.log.bind(console,'[SELF-TEST]'));console.log('[SELF-TEST] roundtrip:',testProfile?'OK':'FAIL');if(!testProfile){document.getElementById('app').innerHTML='<div class="app-wrap"><div class="panel"><div class="red-kuang cp-sm"><h1 style="color:#c0392b">SELF-TEST FAILED</h1><div class="sub">Check console (F12)</div></div></div></div>';return}let pct=(total/2953*100).toFixed(1);let left='';for(let cat of C.cats){let st=profile.states[cat.key]||{},items=ordItems(C.itemMap[cat.key]),liked=[],tried=[];for(let it of items){if(it.deleted)continue;let s=st[it.id]||0;if(s===3)liked.push(itemName(it));else if(s===1)tried.push(itemName(it))}if(!liked.length&&!tried.length)continue;left+='<div class="fin-sec"><h3>'+(T('catName')[cat.key]||cat.key)+'</h3><div class="tg">'+liked.map(t=>'<span class="tag lv">'+t+'</span>').join('')+tried.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div></div>'}document.getElementById('app').innerHTML='<div class="app-wrap"><div class="panel"><div class="red-kuang cp-finish"><div class="fin-split"><div class="fin-left"><h1>'+esc(profile.name||'Anonymo   dlPoster(){let W=2400,H=3600,cv=document.createElement('canvas');cv.width=W;cv.height=H,ctx=cv.getContext('2d');let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f0f0f0');g.addColorStop(1,'#fff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#7c0a21';ctx.fillRect(0,0,W,15);ctx.fillStyle='#7c0a21';ctx.font='bold 170px "Times New Roman",宋体,serif';ctx.textAlign='center';ctx.fillText(profile.name||'Anonymous',W/2,280);let cy=400;if(profile.bio){ctx.fillStyle='rgba(128,128,128,.85)';ctx.font='italic 80px "Times New Roman",宋体,serif';ctx.fillText(profile.bio,W/2,cy);cy+=115}if(profile.message){ctx.fillStyle='#7c0a21';ctx.font='italic 64px "Times New Roman",宋体,serif';ctx.fillText('"'+profile.message+'"',W/2,cy);cy+=115}cy+=55;ctx.textAlign='left';let contentMax=H-1150;for(let cat of C.cats){let st=profile.states[cat.key]||{},items=ordItems(C.itemMap[cat.key]),liked=[];for(let it of items){if(it.deleted)continue;if((st[it.id]||0)===3)liked.push(itemName(it))}if(!liked.length)continue;if(cy>contentMax)break;ctx.fillStyle='#7c0a21';ctx.font='bold 64px "Times New Roman",宋体,serif';ctx.fillText((T('catName')[cat.key]||cat.key),120,cy);cy+=88;ctx.fillStyle='#000';ctx.font='54px "Times New Roman",宋体,serif';let line='',lw=120;for(let i=0;i<liked.length;i++){let t=liked[i]+(i<liked.length-1?'  ':''),m=ctx.measureText(t);if(lw+m.width>W-120){ctx.fillText(line.trim(),120,cy);cy+=64;line=liked[i]+'  ';lw=120+ctx.measureText(liked[i]+'  ').width}else{line+=t;lw+=m.width}}if(line)ctx.fillText(line.trim(),120,cy);cy+=95}let qs=820,qx=(W-qs)/2,qy=H-qs-150;ctx.fillStyle='#fff';ctx.fillRect(qx-50,qy-50,qs+100,qs+100);ctx.imageSmoothingEnabled=false;ctx.drawImage(qrCanvas,qx,qy,qs,qs);ctx.fillStyle='rgba(128,128,128,.75)';ctx.font='52px "Times New Roman",宋体,serif';ctx.textAlign='center';ctx.fillText('Scan to view full profile',W/2,qy-124);ctx.fillText('QR Personal Profile',W/2,H-24);ctx.fillStyle='#7c0a21';ctx.fillRect(0,H-15,W,15);let a=document.createElement('a');a.download='profile_poster.png';a.href=cv.toDataURL('image/png');a.click()},

  showScan(){document.getElementById('app').innerHTML='<div class="app-wrap"><div class="panel"><div class="red-kuang cp-scan"><h1 style="font-size:22px;color:var(--bjsdfz);margin-bottom:6px">'+T('scanTitle')+'</h1><div class="sub" style="font-size:13px;color:var(--wzys-a);margin-bottom:14px">'+T('scanSub')+'</div><div class="scan-drop" id="scanZone" onclick="document.getElementById(\'fi\').click()"><span style="font-size:36px;opacity:.3">+</span><span style="font-size:13px;color:var(--wzys-a)">'+T('scanClick')+'</span></div><input type="file" id="fi" accept="image/*" onchange="App.handleFile(event)" style="display:none"><div id="scanRes" style="text-align:center;margin-top:10px;font-size:13px;min-height:18px"></div><div class="btn-row"><button class="btn sm" onclick="App.handlePaste()">'+T('scanPaste')+'</button></div></div></div></div>';let z=document.getElementById('scanZone');z.addEventListener('dragover',e=>e.preventDefault());z.addEventListener('drop',e=>{e.preventDefault();let f=e.dataTransfer.files[0];if(f)App.processFile(f)});},

  handleFile(e){let f=e.target.files[0];if(f)this.processFile(f)},
  handlePaste(){navigator.clipboard.read().then(items=>{for(let it of items)if(it.types.some(t=>t.startsWith('image/'))){it.getType('image/png').then(b=>App.processFile(new File([b],'c.png')));return}document.getElementById('scanRes').textContent=T('scanNoImg')}).catch(()=>document.getElementById('scanRes').textContent=T('scanDenied'))},

  processFile(file){let r=new FileReader();r.onload=async ev=>{let img=new Image();img.onload=async()=>{let cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height,ctx=cv.getContext('2d');ctx.drawImage(img,0,0);let id=ctx.getImageData(0,0,cv.width,cv.height);if(typeof jsQR!=='undefined'){let code=jsQR(id.data,cv.width,cv.height);if(code){let data=code.data;if(typeof data==='string'&&data.startsWith(QR_URL)){let u=new URL(data);let d=u.searchParams.get('d');if(d){try{let bytes=fromB85(d);App.decodeAndView(bytes);return}catch(e){}}}let rawData=code.binaryData||new TextEncoder().encode(data);let p=decodeProfile(rawData);if(p){document.getElementById('scanRes').textContent=T('scanOK');App.renderView(p)}else document.getElementById('scanRes').textContent=T('scanBadQR')}else document.getElementById('scanRes').textContent=T('scanNoQR')}else document.getElementById('scanRes').textContent='QR scanner not loaded.'};img.src=ev.target.result};r.readAsDataURL(file)},

  renderView(p){this._viewProfile=p;this._viewCat=null;let tabs='';for(let cat of C.cats){let st=p.states[cat.key]||{},count=Object.keys(st).length;tabs+='<span class="cat-tab" onclick="App.switchViewCat(\''+cat.key+'\')" id="vtab_'+cat.key+'">'+(T('catName')[cat.key]||cat.key)+'<span style="font-size:10px;opacity:.5">'+(count?' '+count:'')+'</span></span>'}document.getElementById('app').innerHTML='<div class="app-wrap"><div class="panel"><div class="red-kuang cp-view" style="overflow:hidden;display:flex;flex-direction:column;max-width:1000px"><div class="vw-head"><h1>'+esc(p.name||'Anonymous')+'</h1><div class="bio">'+esc(p.bio||'')+'</div>'+(p.message?'<div class="msg">"'+esc(p.message)+'"</div>':'')+'</div><div class="btn-row" style="margin-top:4px;padding:0 12px 4px;justify-content:flex-start"><button class="btn sm primary" onclick="App.importViewed()">'+T('importView')+'</button></div><div style="padding:4px 12px;flex-shrink:0;display:flex;gap:3px;flex-wrap:wrap;border-bottom:1px solid var(--bjsdfz-a)">'+tabs+'</div><div id="viewBody" style="flex:1;overflow-y:auto;padding:4px 12px 12px"></div></div></div></div>';for(let cat of C.cats){let st=p.states[cat.key]||{};if(Object.keys(st).length>0){this.switchViewCat(cat.key);return}}this.switchViewCat(C.cats[0].key)},

  switchViewCat(key){this._viewCat=key;let p=this._viewProfile,cat=C.catByKey[key],items=C.itemMap[key],st=p.states[key]||{};let slbls=T('stateLbl')[key]||T('stateLbl').dflt;document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));let tab=document.getElementById('vtab_'+key);if(tab)tab.classList.add('active');let groups={};for(let it of items){let g=it.group;if(!groups[g])groups[g]=[];groups[g].push(it)}let cards='';if(cat.groups.length){for(let g of cat.groups){let gItems=groups[g];if(!gItems||!gItems.length)continue;cards+='<div class="grp-hdr">'+TG(g)+' <span style="font-weight:normal;font-size:12px;opacity:.85">'+gItems.length+'</span></div>';for(let it of gItems){if(it.deleted)continue;let s=st[it.id]||0,cl=' s'+s,si='';if(s===1)si='✓';else if(s===2)si='−';else if(s===3)si='♥';cards+='<span class="item-card view-only'+cl+'" data-g="'+it.group+'" data-idx="'+it.id+'" style="cursor:default"><span class="st-icon">'+si+'</span>'+itemName(it)+'</span>'}cards+='<div class="grp-div"></div>'}}else{for(let it of items){if(it.deleted)continue;let s=st[it.id]||0,cl=' s'+s,si='';if(s===1)si='✓';else if(s===2)si='−';else if(s===3)si='♥';cards+='<span class="item-card view-only'+cl+'" data-g="'+it.group+'" data-idx="'+it.id+'" style="cursor:default"><span class="st-icon">'+si+'</span>'+itemName(it)+'</span>'}}let leg='',legIcons=['','✓','−','♥'];for(let i=0;i<4;i++)leg+='<span class="item-card s'+i+'" style="cursor:default"><span class="st-icon">'+legIcons[i]+'</span>'+slbls[i]+'</span>';let sel=0;for(let it of items){if(it.deleted)continue;if(st[it.id])sel++}let body=document.getElementById('viewBody');body.innerHTML='<h1 style="font-size:18px;color:var(--bjsdfz);padding:8px 0 2px;font-weight:normal">'+(T('catName')[key]||key)+'</h1><div style="font-size:12px;color:var(--wzys-a);padding:0 0 8px;font-style:italic">'+sel+'/'+items.length+' '+T('rated')+'</div><div class="search-row"><input placeholder="'+T('search')+'" oninput="App.filterViewItems(this.value)" style="font-size:14px;height:30px"></div><div class="legend">'+leg+'</div><div class="item-grid" id="viewGrid" style="padding-top:4px">'+cards+'</div>'},

  filterViewItems(q){let g=document.getElementById('viewGrid');if(!g)return;q=(q||'').toLowerCase();let items=C.itemMap[this._viewCat]||[];g.querySelectorAll('.item-card').forEach(c=>{if(q===''){c.style.display='';return}let it=items[+c.getAttribute('data-idx')];c.style.display=(c.textContent.toLowerCase().includes(q)||this._itemHit(it,q))?'':'none'})}
};

// Movie popup
let _longPressTimer=null;
document.addEventListener('contextmenu',function(e){let card=e.target.closest('.item-card');if(!card)return;let name=card.textContent.replace(/[♥−✓]/g,'').replace(/\s*·.*$/,'').trim();let idx=card.getAttribute('data-idx');if(idx!=null){let ck=App._curCat||App._viewCat;if(ck&&C.itemMap[ck]&&C.itemMap[ck][+idx])name=itemName(C.itemMap[ck][+idx])}let meta=MOVIE_META[name]||GAME_META[name]||ANIME_META[name]||TV_META[name]||MUSIC_META[name]||BOOK_META[name]||TECH_META[name];e.preventDefault();let popup=document.getElementById('moviePopup');let rows='';if(meta){rows+=(meta.title_en&&meta.title_en!==name?'<div class="mp-row"><span>English:</span> '+esc(meta.title_en)+'</div>':'');rows+=(meta.year?'<div class="mp-row"><span>Year:</span> '+meta.year+'</div>':'');rows+=(meta.runtime?'<div class="mp-row"><span>Runtime:</span> '+meta.runtime+'</div>':'');rows+=(meta.director?'<div class="mp-row"><span>Director:</span> '+esc(meta.director)+'</div>':'');rows+=(meta.actors?'<div class="mp-row"><span>Actors:</span> '+esc(meta.actors)+'</div>':'');rows+=(meta.country?'<div class="mp-row"><span>Country:</span> '+esc(meta.country)+'</div>':'');rows+=(meta.genre?'<div class="mp-row"><span>Genre:</span> '+esc(meta.genre)+'</div>':'');rows+=(meta.publisher?'<div class="mp-row"><span>Publisher:</span> '+esc(meta.publisher)+'</div>':'');rows+=(meta.platform?'<div class="mp-row"><span>Platform:</span> '+esc(meta.platform)+'</div>':'');rows+=(meta.release_date?'<div class="mp-row"><span>Release:</span> '+meta.release_date+'</div>':'');rows+=(meta.up?'<div class="mp-row"><span>UP主:</span> '+esc(meta.up)+'</div>':'');rows+=(meta.bv?'<div class="mp-row"><span>BV:</span> <a href="https://www.bilibili.com/video/'+esc(meta.bv.split('（')[0].trim())+'" target="_blank" style="color:var(--bjsdfz)">'+esc(meta.bv)+'</a></div>':'');rows+=(meta.composer?'<div class="mp-row"><span>Composer:</span> '+esc(meta.composer)+'</div>':'');rows+=(meta.lyricist?'<div class="mp-row"><span>Lyricist:</span> '+esc(meta.lyricist)+'</div>':'');rows+=(meta.singer?'<div class="mp-row"><span>Singer:</span> '+esc(meta.singer)+'</div>':'');rows+=(meta.author?'<div class="mp-row"><span>Author:</span> '+esc(meta.author)+'</div>':'');rows+=(meta.genre?'<div class="mp-row"><span>Genre:</span> '+esc(meta.genre)+'</div>':'');rows+=(meta.score?'<div class="mp-row"><span>IMDB:</span> '+meta.score+'/10</div>':'');rows+=(meta.desc?'<div class="mp-row" style="font-style:italic">'+esc(meta.desc)+'</div>':'');rows+=(meta.votes?'<div class="mp-row"><span>Votes:</span> '+meta.votes+'</div>':'');rows+=(meta.quote?'<div class="mp-row" style="font-style:italic;color:var(--bjsdfz)">"'+esc(meta.quote)+'"</div>':'')}if(!rows)rows='<div class="mp-row" style="color:var(--wzys-a)">No extra info</div>';popup.innerHTML='<div class="mp-title">'+esc(name)+'</div>'+rows;popup.style.left=Math.min(e.clientX,window.innerWidth-310)+'px';popup.style.top=Math.min(e.clientY,window.innerHeight-220)+'px';popup.classList.add('show')});
document.addEventListener('touchstart',function(e){let card=e.target.closest('.item-card');if(!card)return;_longPressTimer=setTimeout(()=>{let ev=new MouseEvent('contextmenu',{clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});card.dispatchEvent(ev)},600)},{passive:true});
document.addEventListener('touchend',()=>clearTimeout(_longPressTimer));
document.addEventListener('touchmove',()=>clearTimeout(_longPressTimer));
document.addEventListener('click',function(e){if(!e.target.closest('.movie-popup'))document.getElementById('moviePopup').classList.remove('show')});
document.addEventListener('scroll',()=>document.getElementById('moviePopup').classList.remove('show'));

App.init();
if(typeof jsQR==='undefined'){let s=document.createElement('script');s.src='jsQR.min.js';document.head.appendChild(s)}

</script>
